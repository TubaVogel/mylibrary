function compareBooks(a,b){ const aTitle=sortTitle(a.title); const bTitle=sortTitle(b.title); const aNumber=/^\d/.test(aTitle); const bNumber=/^\d/.test(bTitle); if(aNumber!==bNumber) return aNumber?1:-1; return aTitle.localeCompare(bTitle,'de'); }
function filteredBooks(){ let list=[...books]; const nq=normalize(query); if(filter==='Haben wir') list=list.filter(b=>b.status==='Haben wir'); if(filter==='Regal') list=list.filter(b=>b.location==='Regal'); if(filter==='Amazon') list=list.filter(b=>(b.source||'').includes('amazon')); if(filter==='Möchte ich lesen') list=list.filter(b=>b.status==='Möchte ich lesen'); if(filter==='Verliehen') list=list.filter(b=>b.status==='Verliehen'); if(nq) list=list.filter(b=>normalize([b.title,bookAuthor(b),b.authors,b.category,b.location,b.notes,b.firstOrderedOn].join(' ')).includes(nq)); if(tab==='search' && !nq) return []; return list.sort(compareBooks); }
function renderFilters(){ const el=document.getElementById('filters'); el.innerHTML=filters.map(f=>'<button class="'+(f===filter?'active':'')+'" data-filter="'+f+'">'+labelFilter(f)+'</button>').join(''); el.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{filter=btn.dataset.filter; render();}); }
function escapeHtml(s){ return String(s||'').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function renderStatic(){ document.documentElement.lang=lang; document.title=t('appTitle'); appTitle.textContent=t('appTitle'); countLabel.textContent=t('books'); searchTab.textContent=t('search'); listTab.textContent=t('list'); search.placeholder=tab==='list'?t('listPlaceholder'):t('searchPlaceholder'); addBtn.setAttribute('aria-label',t('add')); scanBtn.setAttribute('aria-label',lang==='de'?'Buch fotografieren':'Photograph book'); saveBtn.textContent=t('save'); exportBtn.textContent=t('export'); dialogTitle.textContent=t('add'); scanDialogTitle.textContent=lang==='de'?'Buch per Foto suchen':'Search book by photo'; titleLabel.textContent=t('title'); authorLabel.textContent=t('author')||'Author'; statusLabel.textContent=t('status'); locationLabel.textContent=t('location'); loanLabel.textContent=t('loan'); notesLabel.textContent=t('notes'); cancelBook.textContent=t('cancel'); cancelScan.textContent=t('cancel'); submitBook.textContent=t('submit'); const cameraText={de:'Kamera öffnen',en:'Open camera',pt:'Abrir câmera',tr:'Kamerayı aç'}; const useText={de:'Foto verwenden',en:'Use photo',pt:'Usar foto',tr:'Fotoğrafı kullan'}; const closeText={de:'Kamera schließen',en:'Close camera',pt:'Fechar câmera',tr:'Kamerayı kapat'}; const titleHint={de:'Fotografiere das Cover. Die App sucht den erkannten Titel direkt in deiner Library.',en:'Photograph the cover. The app searches your library for the recognized title.',pt:'Fotografe a capa. O app procura o título reconhecido na sua biblioteca.',tr:'Kapağın fotoğrafını çek. Uygulama tanınan başlığı kütüphanende arar.'}; const titlePlaceholder={de:'Oder Titel eingeben',en:'Or enter title',pt:'Ou inserir título',tr:'Veya başlık gir'}; cameraBook.textContent=cameraText[lang]||cameraText.de; captureBook.textContent=useText[lang]||useText.de; closeCamera.textContent=closeText[lang]||closeText.de; titleLookup.textContent=t('isbnSearch'); titleLookupInput.placeholder=titlePlaceholder[lang]||titlePlaceholder.de; scanHint.textContent=titleHint[lang]||titleHint.de; formLocation.placeholder=lang==='de'?'Regal, Keller, unbekannt':lang==='en'?'shelf, cellar, unknown':lang==='pt'?'estante, porão, desconhecido':'raf, bodrum, bilinmiyor'; formLoan.placeholder=lang==='de'?'Lisa, Büro, unbekannt':lang==='en'?'Lisa, office, unknown':lang==='pt'?'Lisa, escritório, desconhecido':'Lisa, ofis, bilinmiyor'; [...formStatus.options].forEach(opt=>{opt.textContent=labelStatus(opt.value);}); languageFlag.textContent=(languageOptions[lang]||languageOptions.de).flag; languageToggle.setAttribute('aria-label','Sprache auswählen: '+(languageOptions[lang]||languageOptions.de).label); document.querySelectorAll('#languagePopover button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang)); }
function card(b){ const sourceBadge=b.location==='Keller' ? labelLocation('Keller') : (b.source||'').includes('amazon') && b.location==='Regal' ? 'Amazon + Regal' : b.location==='Regal' ? labelFilter('Regal') : 'Amazon'; const cls=b.status==='Möchte ich lesen'?'rose':b.status==='Verliehen'?'amber':b.location==='Regal'?'green':'blue'; const author=bookAuthor(b); return '<article class="card" data-id="'+b.id+'">'+coverMarkup(b)+'<div class="meta"><div class="title">'+escapeHtml(b.title)+'</div>'+(author?'<div class="sub">'+escapeHtml(author)+'</div>':'')+'<div class="sub">'+escapeHtml(b.category||t('book'))+'</div><div class="decision">'+escapeHtml(decision(b))+'</div><div class="badges"><span class="badge '+cls+'">'+escapeHtml(labelStatus(b.status))+'</span><span class="badge">'+escapeHtml(sourceBadge)+'</span>'+(b.confidence==='amazon-import'?'<span class="badge blue">'+escapeHtml(t('sourceOpen'))+'</span>':'')+'</div></div></article>'; }
function render(){ document.getElementById('totalCount').textContent=books.length; renderStatic(); renderFilters(); const list=filteredBooks(); if(tab==='search'&&!query){content.innerHTML='<div class="quick"><h2>'+escapeHtml(t('quickTitle'))+'</h2><p>'+escapeHtml(t('quickText'))+'</p></div>'; return;} if(!list.length){content.innerHTML='<div class="empty">'+escapeHtml(t('empty'))+'</div>'; return;} content.innerHTML=list.map(card).join(''); content.querySelectorAll('.card').forEach(el=>el.onclick=()=>openDetails(el.dataset.id)); queueCovers(list); }
function openDetails(id){ const b=books.find(x=>x.id===id); if(!b) return; const author=bookAuthor(b); drawer.innerHTML='<h2>'+escapeHtml(b.title)+'</h2>'+(author?'<div class="sub">'+escapeHtml(author)+'</div>':'')+'<div class="decision">'+escapeHtml(decision(b))+'</div><div class="badges"><span class="badge green">'+escapeHtml(labelStatus(b.status))+'</span><span class="badge">'+escapeHtml(b.location||t('openLocation'))+'</span><span class="badge">'+escapeHtml(b.source||t('openSource'))+'</span></div><div class="section"><strong>'+escapeHtml(t('details'))+'</strong><div>'+escapeHtml(b.category||'')+'</div>'+(b.firstOrderedOn?'<div>Amazon: '+escapeHtml(b.firstOrderedOn)+'</div>':'')+(b.sourcePhotos?'<div>'+escapeHtml(t('photo'))+': '+escapeHtml(b.sourcePhotos)+'</div>':'')+'</div><div class="section"><strong>'+escapeHtml(t('notes'))+'</strong><div>'+escapeHtml(b.notes||t('noNote'))+'</div></div><div class="modal-actions"><button class="secondary" onclick="drawer.classList.remove(\'open\')">'+escapeHtml(t('close'))+'</button><button class="primary" onclick="openEditBook(\''+b.id+'\')">'+escapeHtml(t('changeStatus'))+'</button></div>'; drawer.classList.add('open'); }
function openEditBook(id){ const b=books.find(x=>x.id===id); if(!b) return; const statuses=['Haben wir','Gelesen','Möchte ich lesen','Verliehen']; const locations=['Regal','Keller','Unbekannt']; const currentLocation=b.location==='Regal'?'Regal':b.location==='Keller'?'Keller':'Unbekannt'; drawer.innerHTML='<h2>'+escapeHtml(b.title)+'</h2><div class="formgrid"><label><span>'+escapeHtml(t('status'))+'</span><select id="editStatus">'+statuses.map(s=>'<option value="'+escapeHtml(s)+'">'+escapeHtml(labelStatus(s))+'</option>').join('')+'</select></label><label><span>'+escapeHtml(t('location'))+'</span><select id="editLocation">'+locations.map(s=>'<option value="'+escapeHtml(s)+'">'+escapeHtml(labelLocation(s))+'</option>').join('')+'</select></label><label id="editLoanWrap"><span>'+escapeHtml(t('loan'))+'</span><input id="editLoan" value="'+escapeHtml(b.loanedTo||'')+'"></label></div><div class="modal-actions"><button class="secondary" onclick="openDetails(\''+b.id+'\')">'+escapeHtml(t('cancel'))+'</button><button class="primary" onclick="saveBookChanges(\''+b.id+'\')">'+escapeHtml(t('save'))+'</button></div>'; const status=document.getElementById('editStatus'); status.value=b.status; document.getElementById('editLocation').value=currentLocation; const toggleLoan=()=>{document.getElementById('editLoanWrap').style.display=status.value==='Verliehen'?'grid':'none';}; status.onchange=toggleLoan; toggleLoan(); }
function saveBookChanges(id){ const b=books.find(x=>x.id===id); if(!b) return; b.status=document.getElementById('editStatus').value; b.location=document.getElementById('editLocation').value; b.loanedTo=b.status==='Verliehen'?document.getElementById('editLoan').value.trim():''; save(); render(); openDetails(id); }
document.querySelectorAll('.tabs button').forEach(btn=>btn.onclick=()=>{tab=btn.dataset.tab; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b===btn)); search.placeholder=tab==='list'?t('listPlaceholder'):t('searchPlaceholder'); render();});
document.querySelectorAll('.viewer button').forEach(btn=>btn.onclick=()=>{viewer=btn.dataset.viewer; document.querySelectorAll('.viewer button').forEach(b=>b.classList.toggle('active',b===btn)); render();});
languageToggle.onclick=e=>{e.stopPropagation(); const open=!languageMenu.classList.contains('open'); languageMenu.classList.toggle('open',open); languageToggle.setAttribute('aria-expanded',String(open));};

document.addEventListener('click',e=>{if(!languageMenu.contains(e.target)){languageMenu.classList.remove('open'); languageToggle.setAttribute('aria-expanded','false');}});
search.oninput=e=>{query=e.target.value; render();};
document.getElementById('saveBtn').onclick=()=>{save(); alert(t('saved'));};
document.getElementById('exportBtn').onclick=()=>{const data='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(books,null,2)); const a=document.createElement('a'); a.href=data; a.download='lesebibliothek-export.json'; a.click();};
let cameraStream=null;
function setScanStatus(message,state='') { scanStatus.textContent=message; scanStatus.className='scan-status'+(state?' '+state:''); }
function stopCamera(){ if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop()); cameraStream=null;} cameraVideo.srcObject=null; cameraStage.classList.remove('visible'); }
function resetBookForm(){
  formTitle.value=''; formAuthor.value=''; formStatus.value='Haben wir'; formLocation.value='Regal'; formLoan.value=''; formNotes.value='';
}
function resetScan(){ stopCamera(); titleLookupInput.value=''; scanPreview.removeAttribute('src'); scanPreview.classList.remove('visible'); setScanStatus(''); }
function findBestBook(text){
  const haystack=normalize(text); if(!haystack)return null; const seen=new Set(haystack.split(' ').filter(Boolean)); let best=null; let bestScore=0;
  books.forEach(book=>{
    const title=normalize(book.title); if(!title)return;
    const mainTitle=normalize(String(book.title||'').split(':')[0]);
    const tokens=title.split(' ').filter(token=>token.length>2);
    const mainTokens=mainTitle.split(' ').filter(token=>token.length>2);
    const authorTokens=normalize(bookAuthor(book)).split(' ').filter(token=>token.length>2);
    const coverage=list=>list.filter(token=>seen.has(token)).length/Math.max(list.length,1);
    const containsPhrase=phrase=>(' '+haystack+' ').includes(' '+phrase+' ');
    const mainMatches=mainTokens.filter(token=>seen.has(token)).length;
    const authorMatches=authorTokens.filter(token=>seen.has(token)).length;
    let score=haystack===title?5:(containsPhrase(title)?3+Math.min(tokens.length,20)/100:coverage(tokens));
    if(mainTitle.length>=6&&containsPhrase(mainTitle)) score=Math.max(score,2);
    if(mainMatches>=2) score=Math.max(score,coverage(mainTokens));
    if(mainMatches>=2&&authorMatches) score=Math.max(score,1.25);
    if(mainTokens.length===1&&mainTokens[0].length>=4&&mainMatches===1&&authorMatches) score=Math.max(score,1.1+Math.min(authorMatches,3)/10);
    if(score>bestScore){bestScore=score;best=book;}
  });
  return bestScore>=.66?best:null;
}
function showLibrarySearch(term){
  stopCamera(); scanDialog.close(); tab='search'; filter='Alle'; query=term; search.value=term; document.querySelectorAll('.tabs button').forEach(button=>button.classList.toggle('active',button.dataset.tab==='search')); render();
}
async function lookupBookByTitle(rawTitle){
  const title=String(rawTitle||'').trim(); if(title.length<2){setScanStatus(t('fillTitle'),'warning');return;}
  const existing=findBestBook(title); if(existing){showLibrarySearch(existing.title);return;}
  setScanStatus(t('bookLoading')); let found=null;
  try{
    const response=await fetch('https://www.googleapis.com/books/v1/volumes?q=intitle:'+encodeURIComponent(title)+'&maxResults=5');
    if(response.ok){ const data=await response.json(); const info=data.items&&data.items[0]&&data.items[0].volumeInfo; if(info){ found={title:info.title||'',author:(info.authors||[]).join(', '),publisher:info.publisher||'',cover:(info.imageLinks&&(info.imageLinks.thumbnail||info.imageLinks.smallThumbnail)||'').replace(/^http:/,'https:')}; } }
  }catch(_error){}
  const canonical=found&&found.title?found.title:title; const canonicalMatch=findBestBook(canonical); showLibrarySearch(canonicalMatch?canonicalMatch.title:canonical);
}
async function openCamera(){
  try{
    stopCamera(); cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}); cameraVideo.srcObject=cameraStream; cameraStage.classList.add('visible'); setScanStatus('');
  }catch(_error){ setScanStatus(lang==='de'?'Die Kamera konnte nicht geöffnet werden. Bitte erlaube den Kamerazugriff.':'Camera access is unavailable.','warning'); }
}
async function readTitleFromCanvas(){
  setScanStatus(lang==='de'?'Titel wird erkannt…':'Recognizing title…');
  let text='';
  if('TextDetector' in window){ try{ const detector=new TextDetector(); const lines=await detector.detect(cameraCanvas); text=lines.map(line=>line.rawValue).join(' '); }catch(_error){} }
  if(!text&&window.Tesseract){ try{ const result=await Tesseract.recognize(cameraCanvas,'eng+deu'); text=result.data.text||''; }catch(_error){} }
  const candidate=text.replace(/\s+/g,' ').trim().slice(0,500);
  if(candidate){ titleLookupInput.value=candidate; await lookupBookByTitle(candidate); }
  else { setScanStatus(lang==='de'?'Das Cover ist aufgenommen. Gib den Titel kurz ein, falls er nicht automatisch erkannt wurde.':'Photo captured. Enter the title if it was not recognized automatically.','warning'); titleLookupInput.focus(); }
}
document.getElementById('addBtn').onclick=()=>{resetBookForm(); document.getElementById('bookDialog').showModal();};
document.getElementById('scanBtn').onclick=()=>{resetScan(); document.getElementById('scanDialog').showModal();};
document.getElementById('cameraBook').onclick=openCamera;
document.getElementById('captureBook').onclick=()=>{ if(!cameraVideo.videoWidth)return; cameraCanvas.width=cameraVideo.videoWidth; cameraCanvas.height=cameraVideo.videoHeight; cameraCanvas.getContext('2d').drawImage(cameraVideo,0,0); scanPreview.src=cameraCanvas.toDataURL('image/jpeg',.86); scanPreview.classList.add('visible'); stopCamera(); readTitleFromCanvas(); };
document.getElementById('closeCamera').onclick=stopCamera;
document.getElementById('titleLookup').onclick=()=>lookupBookByTitle(titleLookupInput.value);
document.getElementById('titleLookupInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault(); lookupBookByTitle(titleLookupInput.value);}};
document.getElementById('cancelScan').onclick=()=>{resetScan(); document.getElementById('scanDialog').close();};
document.getElementById('cancelBook').onclick=()=>document.getElementById('bookDialog').close();
document.getElementById('bookForm').addEventListener('submit', e=>{ const title=formTitle.value.trim(); if(!title){ e.preventDefault(); formTitle.setCustomValidity(t('fillTitle')); formTitle.reportValidity(); formTitle.oninput=()=>formTitle.setCustomValidity(''); return; } const existing=books.find(book=>normalize(book.title)===normalize(title)); if(existing){e.preventDefault(); document.getElementById('bookDialog').close(); tab='list'; query=title; search.value=title; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='list')); render(); openDetails(existing.id); return;} const b={id:'b'+Date.now(), title, author:formAuthor.value.trim(), status:formStatus.value, location:formLocation.value.trim()||'Regal', category:'', source:'manuell', confidence:'manuell', firstOrderedOn:'', sourcePhotos:'', notes:formNotes.value.trim(), readBy:viewer, loanedTo:formLoan.value.trim()}; books.push(b); save(); resetBookForm(); render();});
render();
queueCovers(books);
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    let refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    const registration = await navigator.serviceWorker.register("service-worker.js?v=22", { updateViaCache: "none" });
    registration.update();
  });
}
