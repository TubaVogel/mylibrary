function labelLocation(s){ return (locationLabels[s]&&locationLabels[s][lang])||s; }
function labelFilter(f){ return (filterLabels[f]&&filterLabels[f][lang])||f; }
function save(){ localStorage.setItem(storeKey, JSON.stringify(books)); }
function normalize(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
function sortTitle(s){ return normalize(s).replace(/^(the|a|an|der|die|das|ein|eine|einen) /,''); }
function initials(title){ return title.split(/\s+/).filter(Boolean).slice(0,3).map(w=>w[0]).join('').toUpperCase(); }
function coverUrl(b){ const cached=coverCache[b.id]; return typeof cached==='string' ? cached : ''; }
function coverMarkup(b){ const url=coverUrl(b); return '<div class="cover '+(url?'has-cover':'')+'">'+(url?'<img loading="lazy" src="'+escapeHtml(url)+'" alt="">':'')+'<span>'+initials(b.title)+'</span></div>'; }
function saveCovers(){ localStorage.setItem(coverStoreKey, JSON.stringify(coverCache)); }
function bookAuthor(b){ return b.author || authorCache[b.id] || ''; }
function saveAuthors(){ localStorage.setItem(authorStoreKey, JSON.stringify(authorCache)); }
async function fetchCover(b){ if(Object.prototype.hasOwnProperty.call(coverCache,b.id) && (bookAuthor(b) || Object.prototype.hasOwnProperty.call(authorCache,b.id)) || pendingCovers.has(b.id)) return; pendingCovers.add(b.id); try{ const params=new URLSearchParams({title:b.title,fields:'cover_i,title,author_name',limit:'10'}); if(bookAuthor(b)) params.set('author',bookAuthor(b)); const res=await fetch('https://openlibrary.org/search.json?'+params.toString()); if(!res.ok) throw new Error('book lookup failed'); const data=await res.json(); const exact=(data.docs||[]).filter(d=>normalize(d.title)===normalize(b.title)); const expectedAuthor=normalize(bookAuthor(b)); const hit=exact.find(d=>!expectedAuthor||(d.author_name||[]).some(name=>normalize(name)===expectedAuthor)); coverCache[b.id]=hit&&hit.cover_i ? 'https://covers.openlibrary.org/b/id/'+hit.cover_i+'-M.jpg?default=false' : null; if(!b.author) authorCache[b.id]=hit&&hit.author_name?.[0] ? hit.author_name[0] : null; saveCovers(); saveAuthors(); render(); }catch(e){ if(!Object.prototype.hasOwnProperty.call(coverCache,b.id)) coverCache[b.id]=null; if(!Object.prototype.hasOwnProperty.call(authorCache,b.id)) authorCache[b.id]=null; saveCovers(); saveAuthors(); }finally{ pendingCovers.delete(b.id); } }
function processCoverQueue(){ while(activeCoverLookups<3&&coverQueue.length){ const book=coverQueue.shift(); activeCoverLookups++; fetchCover(book).finally(()=>{ activeCoverLookups--; queuedCovers.delete(book.id); processCoverQueue(); }); } }
function queueCovers(list){ list.forEach(book=>{ const complete=Object.prototype.hasOwnProperty.call(coverCache,book.id)&&(bookAuthor(book)||Object.prototype.hasOwnProperty.call(authorCache,book.id)); if(!complete&&!pendingCovers.has(book.id)&&!queuedCovers.has(book.id)){ queuedCovers.add(book.id); coverQueue.push(book); } }); processCoverQueue(); }
function decision(b){ if(b.status==='Verliehen') return t('decisionLoaned') + (b.loanedTo ? t('decisionLoanedTo')+b.loanedTo : '') + '.'; if(b.status==='Möchte ich lesen') return t('decisionWishlist'); if(b.status==='Haben wir') return b.location==='Regal' ? t('decisionShelf') : t('decisionHave'); if(b.status==='Gelesen') return t('decisionRead'); return t('decisionDefault'); }
function compareBooks(a,b){ const aTitle=sortTitle(a.title); const bTitle=sortTitle(b.title); const aNumber=/^\d/.test(aTitle); const bNumber=/^\d/.test(bTitle); if(aNumber!==bNumber) return aNumber?1:-1; return aTitle.localeCompare(bTitle,'de'); }
function filteredBooks(){ let list=[...books]; const nq=normalize(query); if(filter==='Haben wir') list=list.filter(b=>b.status==='Haben wir'); if(filter==='Regal') list=list.filter(b=>b.location==='Regal'); if(filter==='Amazon') list=list.filter(b=>(b.source||'').includes('amazon')); if(filter==='Möchte ich lesen') list=list.filter(b=>b.status==='Möchte ich lesen'); if(filter==='Verliehen') list=list.filter(b=>b.status==='Verliehen'); if(nq) list=list.filter(b=>normalize([b.title,bookAuthor(b),b.authors,b.category,b.location,b.notes,b.firstOrderedOn].join(' ')).includes(nq)); if(tab==='search' && !nq) return []; return list.sort(compareBooks); }
function renderFilters(){ const el=document.getElementById('filters'); el.innerHTML=filters.map(f=>'<button class="'+(f===filter?'active':'')+'" data-filter="'+f+'">'+labelFilter(f)+'</button>').join(''); el.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{filter=btn.dataset.filter; render();}); }
function escapeHtml(s){ return String(s||'').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function renderStatic(){ document.documentElement.lang=lang; document.title=t('appTitle'); appTitle.textContent=t('appTitle'); countLabel.textContent=t('books'); searchTab.textContent=t('search'); listTab.textContent=t('list'); search.placeholder=tab==='list'?t('listPlaceholder'):t('searchPlaceholder'); addBtn.setAttribute('aria-label',t('add')); saveBtn.textContent=t('save'); exportBtn.textContent=t('export'); dialogTitle.textContent=t('add'); titleLabel.textContent=t('title'); authorLabel.textContent=t('author')||'Author'; statusLabel.textContent=t('status'); locationLabel.textContent=t('location'); loanLabel.textContent=t('loan'); notesLabel.textContent=t('notes'); cancelBook.textContent=t('cancel'); submitBook.textContent=t('submit'); formLocation.placeholder=lang==='de'?'Regal, Keller, unbekannt':lang==='en'?'shelf, cellar, unknown':lang==='pt'?'estante, porão, desconhecido':'raf, bodrum, bilinmiyor'; formLoan.placeholder=lang==='de'?'Lisa, Büro, unbekannt':lang==='en'?'Lisa, office, unknown':lang==='pt'?'Lisa, escritório, desconhecido':'Lisa, ofis, bilinmiyor'; [...formStatus.options].forEach(opt=>{opt.textContent=labelStatus(opt.value);}); document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang)); }
function card(b){ const sourceBadge=(b.source||'').includes('amazon') && b.location==='Regal' ? 'Amazon + Regal' : b.location==='Regal' ? labelFilter('Regal') : 'Amazon'; const cls=b.status==='Möchte ich lesen'?'rose':b.status==='Verliehen'?'amber':b.location==='Regal'?'green':'blue'; const author=bookAuthor(b); return '<article class="card" data-id="'+b.id+'">'+coverMarkup(b)+'<div class="meta"><div class="title">'+escapeHtml(b.title)+'</div>'+(author?'<div class="sub">'+escapeHtml(author)+'</div>':'')+'<div class="sub">'+escapeHtml(b.category||t('book'))+'</div><div class="decision">'+escapeHtml(decision(b))+'</div><div class="badges"><span class="badge '+cls+'">'+escapeHtml(labelStatus(b.status))+'</span><span class="badge">'+escapeHtml(sourceBadge)+'</span>'+(b.confidence==='amazon-import'?'<span class="badge blue">'+escapeHtml(t('sourceOpen'))+'</span>':'')+'</div></div></article>'; }
function render(){ document.getElementById('totalCount').textContent=books.length; renderStatic(); renderFilters(); const list=filteredBooks(); if(tab==='search'&&!query){content.innerHTML='<div class="quick"><h2>'+escapeHtml(t('quickTitle'))+'</h2><p>'+escapeHtml(t('quickText'))+'</p></div>'; return;} if(!list.length){content.innerHTML='<div class="empty">'+escapeHtml(t('empty'))+'</div>'; return;} content.innerHTML=list.map(card).join(''); content.querySelectorAll('.card').forEach(el=>el.onclick=()=>openDetails(el.dataset.id)); queueCovers(list); }
function openDetails(id){ const b=books.find(x=>x.id===id); if(!b) return; const author=bookAuthor(b); drawer.innerHTML='<h2>'+escapeHtml(b.title)+'</h2>'+(author?'<div class="sub">'+escapeHtml(author)+'</div>':'')+'<div class="decision">'+escapeHtml(decision(b))+'</div><div class="badges"><span class="badge green">'+escapeHtml(labelStatus(b.status))+'</span><span class="badge">'+escapeHtml(b.location||t('openLocation'))+'</span><span class="badge">'+escapeHtml(b.source||t('openSource'))+'</span></div><div class="section"><strong>'+escapeHtml(t('details'))+'</strong><div>'+escapeHtml(b.category||'')+'</div>'+(b.firstOrderedOn?'<div>Amazon: '+escapeHtml(b.firstOrderedOn)+'</div>':'')+(b.sourcePhotos?'<div>'+escapeHtml(t('photo'))+': '+escapeHtml(b.sourcePhotos)+'</div>':'')+'</div><div class="section"><strong>'+escapeHtml(t('notes'))+'</strong><div>'+escapeHtml(b.notes||t('noNote'))+'</div></div><div class="modal-actions"><button class="secondary" onclick="drawer.classList.remove(\'open\')">'+escapeHtml(t('close'))+'</button><button class="primary" onclick="openEditBook(\''+b.id+'\')">'+escapeHtml(t('changeStatus'))+'</button></div>'; drawer.classList.add('open'); }
function openEditBook(id){ const b=books.find(x=>x.id===id); if(!b) return; const statuses=['Haben wir','Gelesen','Möchte ich lesen','Verliehen']; const locations=['Regal','Keller','Unbekannt']; const currentLocation=b.location==='Regal'?'Regal':b.location==='Keller'?'Keller':'Unbekannt'; drawer.innerHTML='<h2>'+escapeHtml(b.title)+'</h2><div class="formgrid"><label><span>'+escapeHtml(t('status'))+'</span><select id="editStatus">'+statuses.map(s=>'<option value="'+escapeHtml(s)+'">'+escapeHtml(labelStatus(s))+'</option>').join('')+'</select></label><label><span>'+escapeHtml(t('location'))+'</span><select id="editLocation">'+locations.map(s=>'<option value="'+escapeHtml(s)+'">'+escapeHtml(labelLocation(s))+'</option>').join('')+'</select></label><label id="editLoanWrap"><span>'+escapeHtml(t('loan'))+'</span><input id="editLoan" value="'+escapeHtml(b.loanedTo||'')+'"></label></div><div class="modal-actions"><button class="secondary" onclick="openDetails(\''+b.id+'\')">'+escapeHtml(t('cancel'))+'</button><button class="primary" onclick="saveBookChanges(\''+b.id+'\')">'+escapeHtml(t('save'))+'</button></div>'; const status=document.getElementById('editStatus'); status.value=b.status; document.getElementById('editLocation').value=currentLocation; const toggleLoan=()=>{document.getElementById('editLoanWrap').style.display=status.value==='Verliehen'?'grid':'none';}; status.onchange=toggleLoan; toggleLoan(); }
function saveBookChanges(id){ const b=books.find(x=>x.id===id); if(!b) return; b.status=document.getElementById('editStatus').value; b.location=document.getElementById('editLocation').value; b.loanedTo=b.status==='Verliehen'?document.getElementById('editLoan').value.trim():''; save(); render(); openDetails(id); }
document.querySelectorAll('.tabs button').forEach(btn=>btn.onclick=()=>{tab=btn.dataset.tab; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b===btn)); search.placeholder=tab==='list'?t('listPlaceholder'):t('searchPlaceholder'); render();});
document.querySelectorAll('.viewer button').forEach(btn=>btn.onclick=()=>{viewer=btn.dataset.viewer; document.querySelectorAll('.viewer button').forEach(b=>b.classList.toggle('active',b===btn)); render();});
document.querySelectorAll('.lang button').forEach(btn=>btn.onclick=()=>{lang=btn.dataset.lang; localStorage.setItem(langStoreKey,lang); render();});
search.oninput=e=>{query=e.target.value; render();};
document.getElementById('saveBtn').onclick=()=>{save(); alert(t('saved'));};
document.getElementById('exportBtn').onclick=()=>{const data='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(books,null,2)); const a=document.createElement('a'); a.href=data; a.download='lesebibliothek-export.json'; a.click();};
document.getElementById('addBtn').onclick=()=>document.getElementById('bookDialog').showModal();
document.getElementById('cancelBook').onclick=()=>document.getElementById('bookDialog').close();
document.getElementById('bookForm').addEventListener('submit', e=>{ const title=formTitle.value.trim(); if(!title){ e.preventDefault(); formTitle.setCustomValidity(t('fillTitle')); formTitle.reportValidity(); formTitle.oninput=()=>formTitle.setCustomValidity(''); return; } const b={id:'b'+Date.now(), title, author:formAuthor.value.trim(), status:formStatus.value, location:formLocation.value.trim()||'Regal', category:'', source:'manuell', confidence:'manuell', firstOrderedOn:'', sourcePhotos:'', notes:formNotes.value.trim(), readBy:viewer, loanedTo:formLoan.value.trim()}; books.push(b); save(); formTitle.value=''; formAuthor.value=''; formLocation.value=''; formLoan.value=''; formNotes.value=''; render();});
render();
queueCovers(books);
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js"));
}
</script>
</body>
